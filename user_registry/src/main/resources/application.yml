# Registry service configuration.
# YAML nesting builds dotted property names: the lines under "spring: threads: virtual:" mean
# spring.threads.virtual.enabled. Every value here maps to a decision in docs/design.md.

spring:
  application:
    name: registry-service          # label used in logs and metrics

  threads:
    virtual:
      enabled: true                 # design §6: HTTP handlers and Rabbit consumers run on virtual threads
  main:
    keep-alive: true                # keep the JVM alive even when only virtual (daemon) threads are running

  datasource:
    url: jdbc:postgresql://localhost:5432/registry
    username: registry
    password: registry
    hikari:
      maximum-pool-size: 4          # design §6: the DB connection pool is the real bound, not thread count

  flyway:
    enabled: true                   # runs src/main/resources/db/migration/V*.sql at startup

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 2s               # an unreachable broker must fail fast, not hold an admission slot for 60s
    publisher-confirm-type: correlated   # broker tells us per message whether it was accepted
    publisher-returns: true              # broker hands back messages it could not route to a queue
    template:
      mandatory: true                    # required for returns to happen at all
    listener:
      simple:
        concurrency: 4                   # design §6 experiment B: 4 consumers = 4 messages being processed at once
        max-concurrency: 4
        prefetch: 8                      # unacknowledged deliveries allowed per consumer (not parallelism)
        acknowledge-mode: auto           # ack only when the listener method returns without exception
        default-requeue-rejected: false  # a failed message goes to the dead-letter queue, never loops forever
        retry:                           # design §5: finite retries with backoff for transient failures
          enabled: true
          stateless: true                # retried in memory on the same consumer, no requeue round trip
          max-retries: 3                 # 1 attempt + 3 retries, then the recoverer dead-letters it
          initial-interval: 500ms
          multiplier: 2.0                # 500ms, 1s, 2s
          max-interval: 5s

  mvc:
    problemdetails:
      enabled: true                 # errors are RFC 9457 JSON: {"status":400,"detail":...}
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # the API accepts exactly fullName, email, countryCode

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # /actuator/prometheus is what Prometheus scrapes
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: registry-service   # every series gets this label; the dashboard filters on it
    distribution:
      # Histogram buckets for the two latency timers, so p95 is computed from buckets (design §8).
      # Keys with dots must be written in brackets so the dots stay part of the metric name.
      percentiles-histogram:
        "[http.server.requests]": true
        "[registry.registration.completion]": true
      minimum-expected-value:
        "[http.server.requests]": 1ms
        "[registry.registration.completion]": 10ms
      maximum-expected-value:
        "[http.server.requests]": 10s
        "[registry.registration.completion]": 5m     # queue waiting counts; buckets must reach that far

# Our own settings. Spring binds them to the records in com.example.registry.config.
registry:
  intake:
    max-in-flight: 64               # design §4: bound on requests waiting for a broker confirmation
    admission-wait: 200ms           # how long a request may wait for a free slot before a 503
  rabbit:
    exchange: registration
    routing-key: registration.register
    queue: registration.commands
    dead-letter-exchange: registration.dlx
    dead-letter-queue: registration.commands.dlq
    queue-max-length: 20000         # design §5: bounded queue; overflow rejects new publishes
    confirm-timeout: 5s             # design §4: finite wait for the publisher confirmation
