# Tuning: edit these values, then restart with make registry.
# Workers per RabbitMQ command queue; /sync runs directly on HTTP threads.
spring.rabbitmq.listener.simple.concurrency=4
spring.rabbitmq.listener.simple.max-concurrency=${spring.rabbitmq.listener.simple.concurrency}
# Unfinished deliveries per ordinary worker; batch workers use max(prefetch, registry.batch.size).
spring.rabbitmq.listener.simple.prefetch=8
# Batched endpoint: maximum items per worker and collection target (a receive poll can add another wait).
registry.batch.size=100
registry.batch.max-wait=100ms
# Same broker/exchange and DLQ; a separate queue keeps the two processing strategies comparable.
registry.batch.queue=registration.commands.batched
registry.batch.routing-key=registration.register.batched
# Database connections shared by Rabbit workers and direct /sync requests.
spring.datasource.hikari.maximum-pool-size=4
# true = virtual threads; false = platform threads. This does not change worker count.
spring.threads.virtual.enabled=true

spring.application.name=registry-service
spring.main.keep-alive=true
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/registry
spring.datasource.username=registry
spring.datasource.password=registry
spring.flyway.enabled=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.stateless=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s

# Bound HTTP requests waiting for async broker confirmation or a direct /sync database commit.
registry.intake.max-in-flight=64
registry.intake.admission-wait=200ms
registry.rabbit.exchange=registration
registry.rabbit.routing-key=registration.register
registry.rabbit.queue=registration.commands
registry.rabbit.dead-letter-exchange=registration.dlx
registry.rabbit.dead-letter-queue=registration.commands.dlq
registry.rabbit.queue-max-length=20000
registry.rabbit.confirm-timeout=5s

spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=registry-service
management.metrics.distribution.percentiles-histogram[http.server.requests]=true
management.metrics.distribution.percentiles-histogram[registry.registration.completion]=true
management.metrics.distribution.percentiles-histogram[registry.registration.processing]=true
management.metrics.distribution.minimum-expected-value[http.server.requests]=1ms
management.metrics.distribution.minimum-expected-value[registry.registration.completion]=10ms
management.metrics.distribution.minimum-expected-value[registry.registration.processing]=1ms
management.metrics.distribution.maximum-expected-value[http.server.requests]=1m
management.metrics.distribution.maximum-expected-value[registry.registration.completion]=5m
management.metrics.distribution.maximum-expected-value[registry.registration.processing]=1m
