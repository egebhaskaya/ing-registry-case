# Prometheus scrapes both applications and RabbitMQ every second for the local demonstration.
# RabbitMQ updates its queue statistics every 5 seconds by default, independently of scraping.
# Short queue spikes between broker updates can be missed even with one-second scrapes.
global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

scrape_configs:
  # The two applications run on the host (mvnw spring-boot:run or java -jar), not in compose.
  - job_name: registry
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: compliance
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  # RabbitMQ's built-in rabbitmq_prometheus plugin; per-queue series are enabled in
  # infra/rabbitmq/20-prometheus.conf (return_per_object_metrics = true).
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
