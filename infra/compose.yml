# Local infrastructure for the registration case (docs/design.md sections 3 and 8).
# Everything is pinned, local, and keeps its data in named volumes across restarts.
#
#   postgres     one server, two service-owned databases (registry, compliance); wal_level=logical for CDC
#   rabbitmq     command queue between the Registry API and its consumers; management UI + Prometheus plugin
#   kafka        single-node KRaft broker carrying the UserRegistered events
#   connect      Debezium Kafka Connect: reads committed outbox rows from PostgreSQL and publishes them
#   prometheus   scrapes both applications (on the host) and RabbitMQ every 5 seconds
#   grafana      one provisioned dashboard on top of Prometheus; no login, no internet access needed
#
# Profile "init" (one-shot containers, run after the stack is healthy; safe to repeat):
#   kafka-init   creates the event topic and its dead-letter topic with 4 partitions
#   connect-init registers (or updates) the outbox connector through the Connect REST API
#
#   docker compose -f infra/compose.yml up -d --wait
#   docker compose -f infra/compose.yml --profile init up kafka-init connect-init

name: registration-case

services:
  postgres:
    image: postgres:17.11
    command: ["postgres", "-c", "wal_level=logical"]   # logical decoding is what Debezium reads
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost forces TCP, so the entrypoint's temporary init server (Unix socket only) does not count
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.2-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest / guest)
      - "15692:15692"   # Prometheus metrics
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/20-prometheus.conf:/etc/rabbitmq/conf.d/20-prometheus.conf:ro   # per-queue series
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.2
    environment:
      # Single node that is both broker and controller (KRaft, no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: PLAINTEXT for containers on the compose network, EXTERNAL for the host.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Replication factors must be 1 on a single node.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4                   # default for any auto-created topic (design section 5)
      KAFKA_LOG_DIRS: /var/lib/kafka/data       # on the named volume, so offsets and records survive restarts
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.2.2
    profiles: ["init"]   # one-shot; run with: docker compose --profile init up kafka-init connect-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic outbox.event.user --partitions 4 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic outbox.event.user.DLT --partitions 4 --replication-factor 1

  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      # Connect keeps its own state (connector configs, source offsets, status) in Kafka topics,
      # so the connector resumes from where it stopped after a restart.
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    ports:
      - "8083:8083"   # Connect REST API
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  connect-init:
    image: curlimages/curl:8.23.0
    profiles: ["init"]   # one-shot, idempotent; see kafka-init
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./debezium:/debezium:ro
    # PUT /connectors/{name}/config creates the connector or updates it: safe to run on every start.
    # -S shows Connect's error body if the request is rejected (-s alone would hide it).
    command:
      - sh
      - -c
      - >-
        curl -sSf -X PUT -H 'Content-Type: application/json'
        --data @/debezium/registry-outbox-connector.json
        http://connect:8083/connectors/registry-outbox/config

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the two applications run on the host, not in compose
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:13.3.0
    depends_on:
      - prometheus
    environment:
      # Local demo: open the dashboard without a login. Not a production setting.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Offline: no update checks, usage reporting or news feed (design section 3).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  rabbitmq-data:
  kafka-data:
  prometheus-data:
  grafana-data:
