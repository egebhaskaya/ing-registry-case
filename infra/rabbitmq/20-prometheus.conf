# Per-object metrics for the rabbitmq_prometheus plugin (docs/design.md section 8, "Metric correctness").
# By default /metrics aggregates across queues; with this setting every queue gets its own series
# (rabbitmq_queue_messages_ready{queue="registration.commands",...}), which the dashboard needs to show
# the registration queue and the DLQ separately. Fine for a handful of queues; costly with thousands.
# Queue gauges still follow RabbitMQ's default 5-second collect_statistics_interval.
# Scraping every second does not recover short-lived queue peaks between broker updates.
prometheus.return_per_object_metrics = true
