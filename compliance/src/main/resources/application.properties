# Tuning: edit these values, then restart with make compliance.
# Kafka workers: at most four can be active with the topic's four partitions.
spring.kafka.listener.concurrency=4
spring.datasource.hikari.maximum-pool-size=4
spring.threads.virtual.enabled=true

spring.application.name=compliance-service
spring.main.keep-alive=true
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/compliance
spring.datasource.username=compliance
spring.datasource.password=compliance
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=compliance
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Producer is used only for dead-lettered events.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Commit an offset only after the event's database transaction completes.
spring.kafka.listener.ack-mode=record
compliance.kafka.topic=outbox.event.user
compliance.kafka.partitions=4
compliance.demo-rule.flagged-countries=XX,ZZ

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=compliance-service
management.metrics.distribution.percentiles-histogram[compliance.completion]=true
management.metrics.distribution.minimum-expected-value[compliance.completion]=10ms
management.metrics.distribution.maximum-expected-value[compliance.completion]=5m
